# Local smoke test — run the app + Geosupport in containers, but use the graph you
# ALREADY run in Neo4j Desktop (via host.docker.internal). No dump, no seeding, no
# Docker Neo4j, no big Docker VM. Tests the container images + wiring against the
# real full graph.
#
#   cd deploy && docker compose -f docker-compose.local.yml up --build
#   open http://localhost:8501         # no Caddy/auth locally
#
# Reads deploy/.env. Set:
#   NEO4J_PASSWORD           = your Neo4j Desktop password
#   NEO4J_DISCOVERY_DATABASE = discovery   (Desktop's named DB; default here)
#   ANTHROPIC_API_KEY, TAVILY_API_KEY as usual.
# Neo4j Desktop must be RUNNING (bolt on 7687).

services:
  geosupport:
    build:
      context: ../sidecar
      platforms:
        - "linux/amd64"
    expose:
      - "8080"

  streamlit:
    build:
      context: ..
      dockerfile: deploy/streamlit/Dockerfile
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      # host.docker.internal = the Mac host, i.e. your Neo4j Desktop instance.
      NEO4J_URI: "bolt://host.docker.internal:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD}"
      NEO4J_DISCOVERY_DATABASE: "${NEO4J_DISCOVERY_DATABASE:-discovery}"
      GEOSUPPORT_URL: "http://geosupport:8080"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      WATCHLINE_MODEL: "${WATCHLINE_MODEL:-}"
      LANGSMITH_API_KEY: "${LANGSMITH_API_KEY:-}"
      LANGSMITH_TRACING: "${LANGSMITH_TRACING:-}"
      LANGSMITH_PROJECT: "${LANGSMITH_PROJECT:-}"
    ports:
      - "8501:8501"
    depends_on:
      - geosupport
